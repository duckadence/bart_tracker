<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BART Transit Tracker</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="card">

  <h1>BART Transit Tracker</h1>

  <p id="status" class="status">Disconnected</p>

  <button id="connect">Connect ESP32</button>


  <!-- =========================
       WI-FI
       ========================= -->

  <section class="config-section">

    <h2>Wi-Fi</h2>

    <label for="wifi-ssid">Network</label>

    <input
      type="text"
      id="wifi-ssid"
      placeholder="Wi-Fi network name"
      autocomplete="off"
    >

    <label for="wifi-password">Password</label>

    <input
      type="password"
      id="wifi-password"
      placeholder="Wi-Fi password"
      autocomplete="off"
    >

  </section>


  <!-- =========================
       BART STATIONS
       ========================= -->

  <section class="config-section">

    <h2>BART Stations</h2>

    <p>
      Select the stations you want to monitor.
      All BART lines serving each station will be displayed.
    </p>

    <div id="stations"></div>

    <button id="add-station" type="button">
      + Add Station
    </button>

  </section>


  <!-- =========================
       SAVE
       ========================= -->

  <button id="save" disabled>
    Save Configuration
  </button>

</main>

<script src="app.js"></script>

</body>
</html>
