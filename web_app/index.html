<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Transit Tracker</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="card">

    <h1>Transit Tracker</h1>

    <p id="status" class="status">
      Disconnected
    </p>

    <button id="connect">
      Connect ESP32
    </button>


    <section class="config">

      <h2>Wi-Fi</h2>

      <label for="wifi-ssid">
        Network
      </label>

      <input
        id="wifi-ssid"
        type="text"
        placeholder="Wi-Fi network"
      >

      <label for="wifi-password">
        Password
      </label>

      <input
        id="wifi-password"
        type="password"
        placeholder="Wi-Fi password"
      >

    </section>


    <section class="config">

      <h2>BART Stations</h2>

      <label for="station-1">
        Station 1
      </label>

        <option value="12TH">12th St/Oakland City Center</option>

        <option value="NBRK">North Berkeley</option>
        <option value="ORIN">Orinda</option>
        <option value="PHIL">Pleasant Hill</option>
        <option value="POWL">Powell St</option>
        <option value="RICH">Richmond</option>
        <option value="ROCK">Rockridge</option>
        <option value="SBRN">San Bruno</option>
        <option value="SFIA">San Francisco International Airport</option>
        <option value="SSAN">South San Francisco</option>
        <option value="UCTY">Union City</option>
        <option value="WARM">Warm Springs/South Fremont</option>
