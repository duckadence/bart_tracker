<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 LED Control</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>ESP32 LED</h1>
    <p id="status" class="status">Disconnected</p>

    <button id="connect">Connect ESP32</button>

    <div class="controls">
      <button id="on" class="led-button" disabled>LED ON</button>
      <button id="off" class="led-button" disabled>LED OFF</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
